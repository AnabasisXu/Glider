name: Bootstrap
description: Bootstrap workspace
runs:
  using: composite
  steps:
    - name: Set up Flutter
      uses: subosito/flutter-action@v2
      with:
        channel: beta
        flutter-version: 3.22.0-0.1.pre
        cache: true
    - name: Create fvm shim
      shell: bash
      run: |
        mkdir -p "$HOME/.local/bin"
        printf '#!/usr/bin/env bash\nexec "$@"\n' > "$HOME/.local/bin/fvm"
        chmod +x "$HOME/.local/bin/fvm"
        echo "$HOME/.local/bin" >> "$GITHUB_PATH"
    - name: Disable analytics
      shell: bash
      run: |
        dart --disable-analytics
        flutter config --disable-analytics
    - name: Set up Melos
      shell: bash
      run: |
        dart pub global activate melos 5.3.0
        echo "$HOME/.pub-cache/bin" >> "$GITHUB_PATH"
    - name: Bootstrap workspace
      shell: bash
      run: melos bootstrap
